<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>#RememberRanani</title>
    <meta name="description" content="A tribute to Ranani Glazer, a life taken too soon.">
    <meta property="og:title" content="#Remember Ranani" />
    <meta property="og:description" content="Messages, memories, and love for Ranani Niedzielski Glazer." />
    <meta property="og:image" content="https://rememberranani.com/images/hero.png" />
    <meta property="og:url" content="https://rememberranani.com" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

<div id="header-placeholder"></div>
<section class="hero light-theme">
    <div id="particles-js"></div>
    <div class="overlay"></div>
    <div class="hero-content">
        <h1 data-i18n="title">Remember Ranani</h1>
        <p data-i18n="subtitle">“We’ll dance again.”</p>
    </div>
</section>
<!-- SECTIONED STORY LAYOUT -->
<section class="story-section" style="background-image: url('images/baby.jpg')">
    <div class="overlay"></div>
    <div class="text">
        <h2 data-i18n="story.introTitle"></h2>
        <p data-i18n="story.introText"></p>
    </div>
</section>
<section class="split-section">
    <div class="split-image" style="background-image: url('images/gremio.jpg')"></div>
    <div class="split-text fade-in">
        <div class="text">
            <h2 data-i18n="story.gremioTitle"></h2>
         <p data-i18n="story.gremioText"></p>
        </div>
    </div>
</section>
<section class="split-section">
    <div class="split-text fade-in">
        <div class="text">
            <h2 data-i18n="story.armyTitle"></h2>
            <p data-i18n="story.armyText"></p>
        </div>
    </div>
    <div class="split-image" style="background-image: url('images/army.jpg')"></div>
</section>
<section class="split-section">
    <div class="split-image" style="background-image: url('images/drums.jpg')"></div>
    <div class="split-text fade-in">
        <div class="text">
            <h2 data-i18n="story.musicTitle"></h2>
            <p data-i18n="story.musicText"></p>
        </div>
    </div>
</section>
<section class="story-section" style="background-image: url('images/reim.jpg')">
    <div class="overlay"></div>
    <div class="text">
        <h2 data-i18n="story.novaTitle"></h2>
        <p data-i18n="story.novaText"></p>
    </div>
</section>
<section class="split-section">
    <div class="split-image" style="background-image: url('images/goodbye.jpg')"></div>
    <div class="split-text fade-in">
        <div class="text">
            <p data-i18n="story.goodbyeText"></p>
            <blockquote data-i18n="story.fatherQuote"></blockquote>
            <blockquote data-i18n="story.brotherQuote"></blockquote>
            <p data-i18n="story.finalLine" class="final-line"></p>
        </div>
    </div>
</section>
<!-- Candle Section -->
<section class="candle fade-in">
    <div class="container">
        <h2 data-i18n="candle_title"></h2>
        <div id="candle-area">
            <img id="candle-img" src="images/candle-off.png" alt="Unlit Candle" />
            <p><span id="candle-count">0</span><span data-i18n="candle_count"></span></p>
        </div>
    </div>

</section>

<section class="depoiment-grid-section">
    <h2 data-i18n="what_people_say">What People Say</h2>
    <div class="depoiment-grid-wrapper">
        <button class="nav-btn left" id="prevPageBtn">←</button>
        <div class="depoiment-grid" id="depoimentGrid"></div>
        <button class="nav-btn right" id="nextPageBtn">→</button>
    </div>
    <div class="depoiments-link">
        <a data-i18n="leave_message" href="depoiments.html"></a>
    </div>
</section>


<div id="player-bar">
    <div class="player-center">
        <button id="playPauseBtn"><i class="fa fa-play"></i></button>
        <span id="currentTime">00:00</span>
        <div class="progress-container" id="progressContainer">
            <div class="progress" id="progress"></div>
        </div>
        <span id="duration">00:00</span>
    </div>
    <div class="player-right">
        <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="1">
        <button id="muteBtn"><i class="fa fa-volume-up"></i></button>
    </div>
</div>

<audio id="bg-music" loop>
    <source src="music/noiact.mp3" type="audio/mpeg">
</audio>

<script src="https://unpkg.com/i18next-http-backend@1.4.1/i18nextHttpBackend.min.js"></script>
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script src="https://unpkg.com/i18next@21.6.3/i18next.min.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
