<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title data-i18n="page_title">Messages for Ranani</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>

<div id="header-placeholder"></div>

<section class="hero light-theme" style="height: 20vh;">
  <div id="particles-js"></div>
  <div class="overlay"></div>
  <div class="hero-content">
    <h1 data-i18n="page_title">Messages for Ranani</h1>
    <p data-i18n="page_subtitle">💬 Share your words. They mean the world.</p>
  </div>
</section>

<section class="messages-section fade-in">
  <div class="container">
    <h2 data-i18n="leave_message">Leave a Message</h2>
    <form id="messageForm" class="message-form">
      <input type="text" id="name" data-i18n-placeholder="placeholder_name" placeholder="Your Name" required />
      <textarea id="message" data-i18n-placeholder="placeholder_message" placeholder="Your Message" required></textarea>
      <button type="submit" data-i18n="submit">Submit</button>
    </form>

    <!-- Thank You Message -->
    <div id="thankYouMessage" style="display:none; text-align:center; padding:2rem 1rem; font-size:1.1rem; color:#333;" data-i18n="thank_you_message">
      💬 Thank you for your message. It means a lot.
    </div>
    <div class="back-home-link">
      <a href="index.html" data-i18n="back_to_home">← Back to Home</a>
    </div>


    <h3 data-i18n="messages_from_others">Messages from Others</h3>
    <ul id="messageList" class="message-list"></ul>
  </div>

  <div class="back-home-link">
    <a href="index.html" data-i18n="back_to_home">← Back to Home</a>
  </div>
</section>

<div id="footer-placeholder"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script src="https://unpkg.com/i18next@21.6.3/i18next.min.js"></script>
<script src="https://unpkg.com/i18next-http-backend@1.4.1/i18nextHttpBackend.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
